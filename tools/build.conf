# =======================================================
# Zientis 自動編譯工具配置檔案
# =======================================================
# 此檔案包含自動編譯工具的所有配置選項
# 修改後立即生效，無需重啟
# =======================================================

# 專案基本設定
PROJECT_NAME="Zientis"
PROJECT_VERSION="0.2.0-BETA"
VERSION="0.2.0-BETA"

# 模組清單（以空格分隔）
# 按照依賴順序排列，核心模組優先
MODULES="zientis-core zientis-economy zientis-multiworld zientis-social zientis-nations zientis-display zientis-discord-api"

# 核心模組（其他模組依賴的基礎模組）
# 這些模組變更時會觸發依賴模組重新編譯
CORE_MODULES="zientis-core"

# 編譯設定
# 編譯並行數（根據CPU核心數調整）
PARALLEL_JOBS=4

# 是否編譯前先清理
CLEAN_BEFORE_BUILD=false

# 是否只編譯有變更的模組
BUILD_CHANGED_ONLY=true

# 強制重新編譯的檔案擴展名
WATCH_EXTENSIONS="java kt groovy yml yaml properties"

# 部署設定
# 是否自動複製JAR到伺服器
AUTO_COPY_TO_SERVER=true

# 是否在複製後自動重啟伺服器
AUTO_RESTART_SERVER=false

# 伺服器重啟等待時間（秒）
SERVER_RESTART_DELAY=5

# 伺服器相關路徑
MINECRAFT_SERVER_RELATIVE_PATH="minecraft-server"
PLUGINS_RELATIVE_PATH="minecraft-server/plugins"

# 監控模式設定
# 檔案變更檢查時間間隔（秒）
WATCH_INTERVAL=2

# 忽略的檔案和目錄模式
IGNORE_PATTERNS=".git .idea build .gradle target node_modules logs tmp"

# 測試設定
# 排除測試的模組（測試不穩定或耗時過長的模組）
SKIP_TESTS_MODULES="zientis-display"

# 是否在快速模式下跳過測試
QUICK_SKIP_TESTS=true

# 是否在快速模式下跳過文檔生成
QUICK_SKIP_DOCS=true

# 通知設定
# 是否啟用桌面通知（需要notify-send）
ENABLE_NOTIFICATIONS=true

# 編譯成功通知音效
SUCCESS_SOUND=true

# 編譯失敗通知音效
FAILURE_SOUND=true

# 日誌設定
# 日誌等級：DEBUG, INFO, WARN, ERROR
LOG_LEVEL=INFO

# 是否保存編譯日誌
SAVE_BUILD_LOGS=true

# 日誌檔案路徑
LOG_FILE="tools/logs/auto-build.log"

# 日誌保留天數
LOG_RETENTION_DAYS=7

# 效能設定
# Gradle JVM 最大記憶體
GRADLE_MAX_MEMORY="2g"

# Gradle 守護程序設定
GRADLE_DAEMON=true

# 編譯快取設定
BUILD_CACHE=true

# 並行編譯設定
PARALLEL_BUILD=true

# 進階設定
# 自訂 Gradle 參數
CUSTOM_GRADLE_ARGS="--console=plain"

# 預編譯 Hook 腳本（可選）
PRE_BUILD_HOOK=""

# 後編譯 Hook 腳本（可選）
POST_BUILD_HOOK=""

# 預部署 Hook 腳本（可選）
PRE_DEPLOY_HOOK=""

# 後部署 Hook 腳本（可選）
POST_DEPLOY_HOOK=""

# 依賴管理
# 核心模組變更時需要重新編譯的依賴模組映射
# 格式：MODULE:DEPENDENT1,DEPENDENT2
DEPENDENCY_MAP="zientis-core:zientis-economy,zientis-multiworld,zientis-social,zientis-nations,zientis-display"

# 熱重載設定
# 支援熱重載的模組
HOT_RELOAD_MODULES="zientis-core"

# 熱重載延遲時間（秒）
HOT_RELOAD_DELAY=3

# 開發模式設定
# 開發模式（啟用額外的調試功能）
DEVELOPMENT_MODE=true

# 在開發模式下自動啟動伺服器
AUTO_START_SERVER_IN_DEV=false

# 開發模式下的額外 JVM 參數
DEV_JVM_ARGS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005"

# 備份設定
# 部署前是否備份現有JAR
BACKUP_BEFORE_DEPLOY=true

# 備份保留數量
BACKUP_RETENTION_COUNT=5

# 備份目錄
BACKUP_DIR="tools/backups"

# 安全設定
# 生產環境保護（防止意外部署到生產環境）
PRODUCTION_PROTECTION=true

# 生產環境識別標記
PRODUCTION_MARKERS="production prod live"

# 網路設定
# 遠端部署支援
REMOTE_DEPLOY_ENABLED=false

# 遠端伺服器列表
REMOTE_SERVERS=""

# SSH 金鑰路徑
SSH_KEY_PATH="~/.ssh/id_rsa"

# 整合設定
# Discord Webhook 通知（可選）
DISCORD_WEBHOOK_URL=""

# Slack Webhook 通知（可選）
SLACK_WEBHOOK_URL=""

# 電子郵件通知設定（可選）
EMAIL_NOTIFICATIONS=false
SMTP_SERVER=""
SMTP_PORT=587
SMTP_USERNAME=""
SMTP_PASSWORD=""
NOTIFICATION_EMAIL=""