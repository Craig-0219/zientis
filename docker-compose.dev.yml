version: '3.8'

services:
  # MariaDB 資料庫
  mariadb:
    image: mariadb:10.11
    container_name: zientis-dev-db
    environment:
      MYSQL_ROOT_PASSWORD: zientis_dev_2024
      MYSQL_DATABASE: zientis_development
      MYSQL_USER: zientis_dev
      MYSQL_PASSWORD: dev_password_2024
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_buffer_pool_size=256M
      --max_connections=200

  # Redis 快取
  redis:
    image: redis:7-alpine
    container_name: zientis-dev-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # phpMyAdmin (資料庫管理界面)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: zientis-dev-phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_USER: zientis_dev
      PMA_PASSWORD: dev_password_2024
    ports:
      - "8080:80"
    depends_on:
      - mariadb

volumes:
  mariadb_data:
  redis_data: